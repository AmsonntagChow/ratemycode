<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A fix must pass a fresh check</title>
  <desc id="desc">An auditable fix loop: preserve the old snapshot, sweep one root-cause class and change one serial batch, let an independent reviewer run three checks on the same exact release, then record pass, partial, blocked, or accepted-risk outcomes before closing or looping.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#A8A49E"/>
    </marker>
    <marker id="loopArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#C4500F"/>
    </marker>
    <marker id="doneArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#1D7A46"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F4F3F1"/>
  <text x="72" y="80" fill="#6B6B70" font-size="18" font-weight="700" letter-spacing="3" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace">THE FIX LOOP · <tspan fill="#C4500F">03</tspan></text>

  <text x="72" y="157" fill="#1A1A1C" font-size="62" font-weight="750" letter-spacing="-2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Changed does not mean <tspan fill="#C4500F">fixed.</tspan></text>
  <text x="72" y="202" fill="#3C3C41" font-size="26" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">A fresh reviewer has to prove the change really works.</text>

  <path d="M370 407H390" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 407H720" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1200 407H1220" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="258" width="300" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="400" y="258" width="300" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="730" y="258" width="470" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="1230" y="258" width="300" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
  </g>

  <!-- Save old audit -->
  <g transform="translate(0 -12)">
  <circle cx="118" cy="320" r="24" fill="#F6EAE3"/>
  <text x="118" y="328" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">1</text>
  <g transform="translate(184 302)" fill="none" stroke="#C4500F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0H72V76H0Z"/>
    <path d="M18 0V26H54V0M19 57H53"/>
  </g>
  <text x="98" y="427" fill="#1A1A1C" font-size="32" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Save the audit</text>
  <text x="98" y="470" fill="#6B6B70" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Keep the old truth</text>
  <text x="98" y="504" fill="#C4500F" font-size="24" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">before any edit.</text>
  </g>

  <!-- Fix one cause -->
  <g transform="translate(-2 -12)">
  <circle cx="450" cy="320" r="24" fill="#F6EAE3"/>
  <text x="450" y="328" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">2</text>
  <g transform="translate(520 308)" fill="none" stroke="#C4500F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 60L53 15M45 7L61 23M0 68L15 53"/>
    <circle cx="63" cy="5" r="5" fill="#C4500F" stroke="none"/>
  </g>
  <text x="430" y="427" fill="#1A1A1C" font-size="32" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Fix one kind</text>
  <text x="430" y="470" fill="#6B6B70" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Find the same cause.</text>
  <text x="430" y="504" fill="#C4500F" font-size="24" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Change one small batch.</text>
  </g>

  <!-- Fresh reviewer -->
  <g transform="translate(-2 -12)">
  <circle cx="780" cy="320" r="24" fill="#F6EAE3"/>
  <text x="780" y="328" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">3</text>
  <g transform="translate(850 298)" fill="none" stroke="#C4500F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="34" cy="24" r="20"/>
    <path d="M0 76C5 47 63 47 68 76"/>
    <path d="M82 42L95 55L120 29" stroke="#C4500F"/>
  </g>
  <text x="760" y="402" fill="#1A1A1C" font-size="34" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">A fresh reviewer tests</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif" font-size="21" font-weight="700">
    <rect x="760" y="440" width="124" height="48" rx="6" fill="#F6EAE3"/>
    <text x="822" y="471" text-anchor="middle" fill="#C4500F">same task</text>
    <rect x="896" y="440" width="134" height="48" rx="6" fill="#F6EAE3"/>
    <text x="963" y="471" text-anchor="middle" fill="#C4500F">new damage</text>
    <rect x="1042" y="440" width="130" height="48" rx="6" fill="#E7F1EB"/>
    <text x="1107" y="471" text-anchor="middle" fill="#1D7A46">same bug</text>
  </g>
  <text x="760" y="526" fill="#C4500F" font-size="23" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">The fixer cannot give the final checkmark.</text>
  </g>

  <!-- Save new result -->
  <g transform="translate(-2 -12)">
  <circle cx="1280" cy="320" r="24" fill="#E7F1EB"/>
  <text x="1280" y="328" text-anchor="middle" fill="#1D7A46" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">4</text>
  <g transform="translate(1346 300)" fill="none" stroke="#1D7A46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0H72V76H0Z"/>
    <path d="M16 39L29 52L56 24"/>
  </g>
  <text x="1260" y="427" fill="#1A1A1C" font-size="32" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Save the result</text>
  <text x="1260" y="470" fill="#6B6B70" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Write what passed</text>
  <text x="1260" y="504" fill="#1D7A46" font-size="24" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">and what did not.</text>
  </g>

  <!-- A shallow return arrow: verification can loop back, editing never runs in parallel. -->
  <path d="M1379 556V598H577C554 598 549 585 549 565" fill="none" stroke="#C4500F" stroke-width="5" stroke-linecap="round" marker-end="url(#loopArrow)"/>

  <!-- Second-read auditability rail -->
  <text x="72" y="632" fill="#6B6B70" font-size="18" font-weight="700" letter-spacing="2.2" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace">WHAT MAKES THE LOOP AUDITABLE</text>
  <rect x="70" y="648" width="1460" height="124" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
  <path d="M400 648V772M730 648V772M1200 648V772" stroke="#E4E2DE"/>
  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="1.4" fill="#6B6B70">
    <text x="94" y="684">HISTORY</text>
    <text x="424" y="684">SCOPE</text>
    <text x="754" y="684">INDEPENDENCE</text>
    <text x="1224" y="684">RESULT</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1A1A1C">
    <text x="94" y="728">Old snapshot stays</text>
    <text x="424" y="728">One cause · serial batch</text>
    <text x="754" y="728">Three checks · same exact release</text>
    <text x="1224" y="728">Pass · partial · blocked · risk</text>
  </g>

  <!-- Outcomes -->
  <rect x="70" y="808" width="715" height="62" rx="18" fill="#F6EAE3" stroke="#E8CABC"/>
  <text x="106" y="847" fill="#C4500F" font-size="23" font-weight="800" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">STILL OPEN → NEXT SERIAL BATCH</text>
  <rect x="815" y="808" width="715" height="62" rx="18" fill="#E7F1EB" stroke="#C9DED2"/>
  <text x="851" y="836" fill="#1D7A46" font-size="22" font-weight="800" letter-spacing="0.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">INDEPENDENTLY VERIFIED → CLOSE</text>
  <text x="851" y="860" fill="#6B6B70" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Accepted risk is named, never called fixed.</text>
</svg>
