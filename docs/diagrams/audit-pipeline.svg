<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How RateMyCode reaches a verdict</title>
  <desc id="desc">Five review steps with a second layer of detail: resolve one exact release, choose a reviewer role and depth, test real behavior and edge cases, separate proof from inference and unknowns, then distinguish the requested release from the highest safe release.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#A8A49E"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F4F3F1"/>
  <text x="72" y="80" fill="#6B6B70" font-size="18" font-weight="700" letter-spacing="3" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace">THE REVIEW · <tspan fill="#C4500F">01</tspan></text>

  <text x="72" y="157" fill="#1A1A1C" font-size="62" font-weight="750" letter-spacing="-2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Find it. Try it. Tell the <tspan fill="#C4500F">truth.</tspan></text>
  <text x="72" y="202" fill="#3C3C41" font-size="26" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Five steps from “here is my app” to “this is safe to ship.”</text>

  <path d="M342 407H357" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M639 407H654" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M936 407H951" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1233 407H1248" stroke="#A8A49E" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="258" width="272" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="367" y="258" width="272" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="664" y="258" width="272" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="961" y="258" width="272" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
    <rect x="1258" y="258" width="272" height="298" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
  </g>

  <!-- Step 1 -->
  <circle cx="116" cy="309" r="23" fill="#F6EAE3"/>
  <text x="116" y="317" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">1</text>
  <g transform="translate(175 328)" fill="none" stroke="#C4500F" stroke-width="6" stroke-linecap="round">
    <circle cx="0" cy="0" r="28"/>
    <path d="M20 20L48 48"/>
  </g>
  <text x="94" y="407" fill="#1A1A1C" font-size="31" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Find one app</text>
  <text x="94" y="447" fill="#6B6B70" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">One clear product.</text>
  <rect x="94" y="478" width="228" height="48" rx="6" fill="#F8E9E8"/>
  <text x="208" y="509" text-anchor="middle" fill="#C4362C" font-size="19" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Can't find it? Ask. Stop.</text>

  <!-- Step 2 -->
  <g transform="translate(1 0)">
  <circle cx="412" cy="309" r="23" fill="#F6EAE3"/>
  <text x="412" y="317" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">2</text>
  <g transform="translate(471 303)" fill="none" stroke="#C4500F" stroke-width="5" stroke-linecap="round">
    <path d="M0 0H72M0 30H72M0 60H72"/>
    <circle cx="22" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="52" cy="30" r="8" fill="#FFFFFF"/>
    <circle cx="31" cy="60" r="8" fill="#FFFFFF"/>
  </g>
  <text x="390" y="407" fill="#1A1A1C" font-size="31" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Pick the review</text>
  <text x="390" y="447" fill="#6B6B70" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Who should judge it?</text>
  <text x="390" y="481" fill="#C4500F" font-size="23" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">How strict?</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(2 0)">
  <circle cx="708" cy="309" r="23" fill="#F6EAE3"/>
  <text x="708" y="317" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">3</text>
  <g transform="translate(767 300)" fill="none" stroke="#C4500F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="72" height="72" rx="18"/>
    <path d="M28 20L53 36L28 52Z" fill="#C4500F" stroke="none"/>
  </g>
  <text x="686" y="407" fill="#1A1A1C" font-size="31" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Try real tasks</text>
  <text x="686" y="447" fill="#6B6B70" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Use it like a customer.</text>
  <text x="686" y="481" fill="#C4500F" font-size="23" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Try a failure too.</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(3 0)">
  <circle cx="1004" cy="309" r="23" fill="#F6EAE3"/>
  <text x="1004" y="317" text-anchor="middle" fill="#C4500F" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">4</text>
  <g transform="translate(1063 302)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="30" r="25" stroke="#C4500F" stroke-width="6"/>
    <path d="M8 30L17 39L34 20" stroke="#C4500F" stroke-width="6"/>
    <circle cx="72" cy="30" r="25" stroke="#8F6100" stroke-width="6"/>
    <path d="M66 23C68 13 82 14 82 24C82 31 72 31 72 39" stroke="#8F6100" stroke-width="5"/>
    <circle cx="72" cy="48" r="3" fill="#8F6100"/>
  </g>
  <text x="982" y="407" fill="#1A1A1C" font-size="29" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Sort the evidence</text>
  <text x="982" y="447" fill="#6B6B70" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">What did we prove?</text>
  <text x="982" y="481" fill="#8F6100" font-size="23" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">What is still unknown?</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(4 0)">
  <circle cx="1300" cy="309" r="23" fill="#E7F1EB"/>
  <text x="1300" y="317" text-anchor="middle" fill="#1D7A46" font-size="22" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">5</text>
  <g transform="translate(1362 299)" fill="none" stroke="#1D7A46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 75V0M12 4H70L56 27L70 50H12"/>
  </g>
  <text x="1278" y="407" fill="#1A1A1C" font-size="29" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Set the safe line</text>
  <text x="1278" y="447" fill="#6B6B70" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">List every problem.</text>
  <text x="1278" y="481" fill="#1D7A46" font-size="23" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Can it ship safely?</text>
  </g>

  <!-- Second-read detail rail -->
  <text x="72" y="594" fill="#6B6B70" font-size="18" font-weight="700" letter-spacing="2.2" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace">WHAT EACH STEP LEAVES BEHIND</text>
  <rect x="70" y="610" width="1460" height="124" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
  <path d="M355 610V734M652 610V734M949 610V734M1246 610V734" stroke="#E4E2DE"/>

  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#6B6B70">
    <text x="94" y="646">TARGET</text>
    <text x="391" y="646">SETTINGS</text>
    <text x="688" y="646">EDGE CASES</text>
    <text x="985" y="646">EVIDENCE</text>
    <text x="1282" y="646">VERDICT</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1A1A1C">
    <text x="94" y="690">One exact release</text>
    <text x="391" y="690">Role + depth</text>
    <text x="688" y="690">Retry · race · access</text>
    <text x="1282" y="690">Requested ↔ safe</text>
  </g>
  <text x="985" y="690" fill="#1A1A1C" font-size="20" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Proven · inferred · unknown</text>

  <rect x="70" y="770" width="1460" height="82" rx="18" fill="#FFFFFF" stroke="#D8D6D1"/>
  <circle cx="120" cy="811" r="23" fill="#E7F1EB"/>
  <path d="M109 811L117 819L132 802" fill="none" stroke="#C4500F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="164" y="820" fill="#1A1A1C" font-size="29" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Test the product first. Read the code to explain why.</text>
  <text x="1502" y="817" text-anchor="end" fill="#6B6B70" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">Untested stays unknown.</text>
</svg>
